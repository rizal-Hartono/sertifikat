<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Jadwal</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .header-dashboard {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .badge {
      background: #e8f0fe;
      color: #4285f4;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 14px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    thead tr {
      background: #4285f4;
      color: white;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    tbody tr:hover {
      background: #f5f9ff;
    }
    tbody tr:last-child td {
      border-bottom: none;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #888;
    }
    .error {
      text-align: center;
      padding: 40px;
      color: red;
    }
    .nav-link {
      display: inline-block;
      margin-bottom: 16px;
      color: #4285f4;
      text-decoration: none;
      font-size: 14px;
    }
    .nav-link:hover {
      text-decoration: underline;
    }
    .total {
      text-align: right;
      margin-top: 12px;
      color: #888;
      font-size: 14px;
    }
    .center h1{
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- <div class="header-dashboard">
      <div class="center">
        <h1>Dashboard Jadwal</h1>
        <p>Daftar kegiatan dan acara yang akan datang</p>
      </div>
      <span class="badge" id="badge-total">Memuat...</span>
    </div> -->
<h1>Dashboard Jadwal Kegiatan Kalibrasi</h1>
    <div id="loading" class="loading">Mengambil data jadwal...</div>
    <div id="error" class="error" style="display:none"></div>

    <div id="tabel-wrapper" style="display:none">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
      <p class="total" id="total-text"></p>
    </div> 
  </div>

  <script>
    async function loadJadwal() {
  const loading = document.getElementById('loading');
  const error = document.getElementById('error');
  const tabelWrapper = document.getElementById('tabel-wrapper');
  const thead = document.getElementById('thead');
  const tbody = document.getElementById('tbody');
  const totalText = document.getElementById('total-text');

  try {
    const res = await fetch('/api/jadwal');
    const data = await res.json();

    loading.style.display = 'none';

    if (!res.ok) {
      error.textContent = data.error || 'Terjadi kesalahan';
      error.style.display = 'block';
      return;
    }

    // Buat header tabel dari key object pertama
    const headers = Object.keys(data[0]);
    const headerRow = document.createElement('tr');
    headers.forEach(h => {
      const th = document.createElement('th');
      th.textContent = h;
      headerRow.appendChild(th);
    });
    thead.appendChild(headerRow);

    // Isi baris data
    data.forEach(item => {
      const row = document.createElement('tr');
      headers.forEach(h => {
        const td = document.createElement('td');
        td.textContent = item[h];
        row.appendChild(td);
      });
      tbody.appendChild(row);
    });

    totalText.textContent = `Total: ${data.length} kegiatan`;
    tabelWrapper.style.display = 'block';

  } catch (err) {
    loading.style.display = 'none';
    error.textContent = 'Gagal menghubungi server';
    error.style.display = 'block';
  }
}

loadJadwal();
  </script>
</body>
</html>
